  content_excerpt: '# Thai STT


    Thai speech-to-text desktop app with Silero VAD, Google Web Speech / Groq Whisper engines, screen-region OCR (Tesseract / Gemini), and a PySide6 liquid-glass control surface.


    ## Install


    Python 3.12+ is required. For normal installation:


    ```bash

    pip install -e .

    ```


