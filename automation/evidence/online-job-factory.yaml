  content_excerpt: '# Project Rules


    ## Mission


    Online Job Factory มีหน้าที่ช่วยค้นหา ประเมิน เตรียมสมัคร ผลิต ตรวจ และติดตามงานออนไลน์ขนาดเล็กที่มีโอกาสปิดงานได้จริงและคุ้มต้นทุน


    ## Phase 1 Guardrails


    - รับงาน active พร้อมกันสูงสุด 1 งาน

    - งานใหม่ต้องมี scope, input, output และ deadline ชัดเจนก่อนรับ

    - งานที่ต้องวางระบบใหม่ขนาดใหญ่ให้ `NO-GO` หรือ `NEEDS_REPLAN`

    - ต้องมี Owner approval ก่อน submit application

    - ต้องมี Owner approval ก่อนส่ง deliverable ให้ลูกค้า

    - ห้ามระบบสร้าง commitment กับลูกค้าเอง เช่น ราคา'
